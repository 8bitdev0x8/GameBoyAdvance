<div id="rp2350-memory-map">
  <h2>RP2350 memory explorer</h2>
  <div class="text-small text-muted">V44 snapshot · build allocations + retained board measurements</div>
  <div class="nav nav-pills memory-tabs" role="tablist" aria-label="Memory chip"></div>
  <div id="memory-map-panel" role="tabpanel" aria-labelledby="memory-tab-2">
    <div class="memory-toolbar"><div class="memory-breadcrumb"></div><button type="button" class="btn btn-ghost memory-back" disabled>Back</button></div>
    <div class="memory-context tabular-nums text-small"></div>
    <div class="memory-legend text-small" aria-label="Allocation categories"></div>
    <svg class="memory-svg" role="img" aria-label="Memory allocation treemap"></svg>
    <div class="memory-detail" aria-live="polite"></div>
    <details class="memory-list" open><summary>Allocation list</summary>
      <div class="table-responsive"><table class="table table-sm"><thead><tr><th>Allocation</th><th class="text-end">Size</th><th class="text-end">Share</th></tr></thead><tbody></tbody></table></div>
    </details>
  </div>
</div>
<style>
#rp2350-memory-map .memory-tabs{margin:16px 0;flex-wrap:wrap}
#rp2350-memory-map .memory-toolbar{display:flex;justify-content:space-between;align-items:center;gap:12px}
#rp2350-memory-map .memory-breadcrumb{display:flex;flex-wrap:wrap;align-items:center;gap:4px}
#rp2350-memory-map .memory-context{margin:8px 0;color:var(--muted-foreground)}
#rp2350-memory-map .memory-legend{display:flex;flex-wrap:wrap;gap:8px 16px;margin:12px 0}
#rp2350-memory-map .memory-legend span{display:inline-flex;align-items:center;gap:6px}
#rp2350-memory-map .memory-swatch{display:inline-block;width:10px;height:10px;background:var(--mark-color)}
#rp2350-memory-map .memory-svg{display:block;width:100%;height:300px}
#rp2350-memory-map .memory-svg text{fill:var(--foreground);font-size:12px;pointer-events:none}
#rp2350-memory-map .memory-detail{margin:14px 0;min-height:3em;overflow-wrap:anywhere}
#rp2350-memory-map .memory-list{margin-top:10px}
#rp2350-memory-map th:first-child{width:64%}
#rp2350-memory-map .memory-byte-value{display:block;margin-top:4px}
@media(max-width:440px){#rp2350-memory-map .memory-svg{height:270px}}
</style>

<script>
(()=>{
const root=document.getElementById('rp2350-memory-map'),data=JSON.parse(document.getElementById('rp2350-memory-data').textContent);
const tabs=root.querySelector('.memory-tabs'),panel=root.querySelector('[role=tabpanel]'),svg=root.querySelector('svg'),crumb=root.querySelector('.memory-breadcrumb'),context=root.querySelector('.memory-context'),detail=root.querySelector('.memory-detail'),back=root.querySelector('.memory-back'),tbody=root.querySelector('tbody');
const ns='http://www.w3.org/2000/svg',index=new Map(),buttons=[];
const kinds={rom:['ROM / ROM caches','var(--viz-series-1)'],code:['Native code','var(--viz-series-3)'],data:['Game / runtime data','var(--viz-series-4)'],video:['Video buffers','var(--viz-series-5)'],free:['Known free','var(--viz-series-2)'],unknown:['Reserved / unmeasured','var(--muted)']};
function size(n){return n>=1048576?(n/1048576).toFixed(2)+' MiB':n<1024?n+' B':(n/1024).toFixed(1)+' KiB'}
function prepare(node,path,parent){node.path=path+'/'+node.name;node.parent=parent;index.set(node.path,node);if(node.children){node.children.forEach(n=>prepare(n,node.path,node));node.value=node.children.reduce((a,n)=>a+n.value,0)}}
data.forEach(n=>prepare(n,'',null));
let bank=2,current=data[bank],selected=current;
const saved=window.openai?.widgetState?.modelContent;
if(saved&&index.has(saved.view)){current=index.get(saved.view);bank=data.findIndex(n=>current.path.startsWith(n.path+'/')||current===n);selected=index.get(saved.allocation)||current}
function save(){window.openai?.setWidgetState({modelContent:{view:current.path,allocation:selected.path},privateContent:null}).catch(()=>{})}
function el(name,attrs={}){const e=document.createElementNS(ns,name);for(const[k,v]of Object.entries(attrs))e.setAttribute(k,v);return e}
function layout(items,x,y,w,h,out){if(items.length===1){out.push({node:items[0],x,y,w,h});return}const total=items.reduce((a,n)=>a+n.value,0);let sum=0,k=0;while(k<items.length-1&&sum<total/2)sum+=items[k++].value;if(w>=h){const cut=w*sum/total;layout(items.slice(0,k),x,y,cut,h,out);layout(items.slice(k),x+cut,y,w-cut,h,out)}else{const cut=h*sum/total;layout(items.slice(0,k),x,y,w,cut,out);layout(items.slice(k),x,y+cut,w,h-cut,out)}}
function choose(node){selected=node;if(node.children)current=node;render();save()}
function navigate(node){current=node;selected=node;render();save()}
for(const[k,[label,color]]of Object.entries(kinds)){const span=document.createElement('span'),swatch=document.createElement('i');swatch.className='memory-swatch';swatch.style.setProperty('--mark-color',color);swatch.setAttribute('aria-hidden','true');span.append(swatch,document.createTextNode(label));root.querySelector('.memory-legend').append(span)}
data.forEach((node,i)=>{const button=document.createElement('button');button.type='button';button.id='memory-tab-'+i;button.className='nav-link';button.setAttribute('role','tab');button.setAttribute('aria-controls','memory-map-panel');button.textContent=['PSRAM · 8 MiB','Flash · 8 MiB','SRAM · 520 KiB','OTP · 8 KiB'][i];button.addEventListener('click',()=>{bank=i;navigate(data[i])});tabs.append(button);buttons.push(button)});
back.addEventListener('click',()=>navigate(current.parent||current));
function draw(){const width=Math.max(260,svg.getBoundingClientRect().width),height=svg.getBoundingClientRect().height;svg.replaceChildren();svg.setAttribute('viewBox',`0 0 ${width} ${height}`);const title=el('title');title.textContent=current.name+' — '+size(current.value)+'. Select a rectangle or an allocation-list row for details.';svg.append(title);
const places=[];layout([...(current.children||[current])].sort((a,b)=>b.value-a.value),0,0,width,height,places);
for(const p of places){const n=p.node,x=p.x+2,y=p.y+2,w=Math.max(0,p.w-4),h=Math.max(0,p.h-4),color=kinds[n.kind||'data'][1];
const rect=el('rect',{x,y,width:w,height:h,class:'cursor-interaction','data-tooltip':n.name+' · '+size(n.value)+' · '+(100*n.value/current.value).toFixed(1)+'%'+(n.children?' · Open breakdown':'')});rect.style.fill=n.kind==='unknown'?color:`color-mix(in srgb,${color} ${selected===n?'48':'25'}%,var(--background))`;rect.addEventListener('click',()=>choose(n));svg.append(rect);
if(w<86||h<44)continue;
const max=Math.max(8,Math.floor((w-18)/7)),words=n.name.split(' '),lines=[];let line='';for(const word of words){if((line+' '+word).trim().length>max&&line){lines.push(line);line=word}else line=(line+' '+word).trim()}if(line)lines.push(line);const visible=lines.slice(0,h>=76?2:1);if(lines.length>visible.length)visible[visible.length-1]=visible.at(-1).slice(0,Math.max(1,max-1))+'…';
visible.forEach((line,i)=>{const t=el('text',{x:x+9,y:y+20+i*17});t.textContent=line;svg.append(t)});
const value=el('text',{x:x+9,y:y+23+visible.length*17});value.textContent=size(n.value)+(w>155?' · '+(100*n.value/current.value).toFixed(1)+'%':'');svg.append(value);
}}
function render(){buttons.forEach((b,i)=>{b.classList.toggle('active',i===bank);b.setAttribute('aria-selected',String(i===bank))});panel.setAttribute('aria-labelledby',buttons[bank].id);back.disabled=!current.parent;
crumb.replaceChildren();const ancestors=[];for(let n=current;n;n=n.parent)ancestors.unshift(n);ancestors.forEach((n,i)=>{if(i)crumb.append(document.createTextNode('›'));const b=document.createElement('button');b.type='button';b.className='btn btn-ghost';b.textContent=n.name;b.disabled=n===current;b.addEventListener('click',()=>navigate(n));crumb.append(b)});
context.textContent=size(current.value)+' capacity in this view'+(current===data[bank]?' · '+['7,673 KiB allocated · 7 KiB arena spare · 512 KiB outside arena unmeasured','4.84 MiB image span · 3.15 MiB outside image · 8 KiB reserved','11,088 B reported free heap · scratch reserve counted separately','Provisioning occupancy not read'][bank]:' · '+(100*current.value/data[bank].value).toFixed(1)+'% of '+data[bank].name);
detail.replaceChildren();const name=document.createElement('strong');name.textContent=selected.name+' · '+size(selected.value);const note=document.createElement('span');note.className='memory-byte-value text-small text-muted tabular-nums';note.textContent=selected.value.toLocaleString()+' bytes'+(selected.note?' · '+selected.note:'');detail.append(name,note);
tbody.replaceChildren();for(const node of [...(current.children||[current])].sort((a,b)=>b.value-a.value)){const tr=document.createElement('tr'),nameCell=document.createElement('td'),sizeCell=document.createElement('td'),shareCell=document.createElement('td'),button=document.createElement('button');button.type='button';button.className='btn btn-ghost';button.textContent=node.name+(node.children?' ›':'');button.setAttribute('data-tooltip',node.note||node.name);button.addEventListener('click',()=>choose(node));nameCell.append(button);sizeCell.className=shareCell.className='text-end tabular-nums';sizeCell.textContent=size(node.value);shareCell.textContent=(100*node.value/current.value).toFixed(1)+'%';tr.append(nameCell,sizeCell,shareCell);tbody.append(tr)}draw()}
new ResizeObserver(draw).observe(svg);
window.addEventListener('openai:set_globals',event=>{const s=event.detail?.globals?.widgetState?.modelContent;if(s&&index.has(s.view)){current=index.get(s.view);bank=data.findIndex(n=>current.path.startsWith(n.path+'/')||current===n);selected=index.get(s.allocation)||current;render()}});
render();
})();
</script>
